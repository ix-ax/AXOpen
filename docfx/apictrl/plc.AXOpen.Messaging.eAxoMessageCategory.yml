  namespace: plc.AXOpen.Messaging
  summary: Potential problem message.Use this category when you want to report to the user an information about a potential problem, that does not necessarily affect a processbut may cause a problem. This is typically used when certain conditions is expected to happen within a process that did not happen yet,this category is aimed to be later automatically requalified to Warning or Error by coordination primitive if the expected conditions did not happen within expected time.
