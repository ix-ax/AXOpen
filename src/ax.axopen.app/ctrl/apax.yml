name: "@inxton/ax.axopen.app"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": '0.0.48'
devDependencies:
  "@inxton/ax-sdk": '0.0.0-dev.0'
dependencies:
  "@ax/simatic-clocks": 11.0.14
  "@ax/system-bitaccess": 10.3.25
  "@ax/system-math": 10.3.25
  "@ax/system-serde": 10.3.25
  "@ax/dcp-utility": 1.2.0
  "@ax/hardware-diagnostics": 1.1.1
  "@ax/simatic-tasks": 11.0.2
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  ib: |
    START=$(date +%s)
    apax install
    apax build
    dotnet ixc
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax ib' Finished in :" $(expr $(date +%s) - $START) "s"
  icb: |
    START=$(date +%s)
    apax install --catalog --strict
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax icb' Finished in :" $(expr $(date +%s) - $START) "s"
  cib: |
    START=$(date +%s)
    apax clean
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cib' Finished in :" $(expr $(date +%s) - $START) "s"
  cicb: |
    START=$(date +%s)
    apax clean
    apax icb
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cicb' Finished in :" $(expr $(date +%s) - $START) "s"
