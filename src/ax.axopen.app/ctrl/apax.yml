name: "@inxton/ax.axopen.app"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": 0.0.20
devDependencies:
  "@inxton/ax-sdk": '0.0.0-dev.0'
dependencies:
  "@ax/simatic-1500-clocks": 10.0.6
  "@ax/system-bitaccess": 10.0.24
  "@ax/system-math": 10.0.24
  "@ax/system-serde": 10.0.24
  "@ax/dcp-utility": 1.2.0
  "@ax/hardware-diagnostics": 0.3.0
  "@ax/simatic-1500-tasks": 10.0.1
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  ib: |
    apax install
    apax build
  icb: |
    apax install --catalog
    apax ib
  cib: |
    apax clean
    apax ib
  cicb: |
    apax clean
    apax icb

