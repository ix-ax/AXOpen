name: "@inxton/ax.axopen.app"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": 0.0.10
devDependencies:
  "@inxton/ax-sdk": '0.0.0-dev.0'
dependencies:
  "@ax/simatic-1500-clocks": 9.0.1
  "@ax/system-bitaccess": 9.0.12
  "@ax/system-math": 9.0.12
  "@ax/system-serde": 9.0.12
  "@ax/dcp-utility": 1.1.3
  "@ax/hardware-diagnostics": 0.3.0
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  ib: |
    apax install
    apax build
  icb: |
    apax install --catalog
    apax ib
  cib: |
    apax clean
    apax ib
  cicb: |
    apax clean
    apax icb
