name: "components.abstractions-app"
version: '0.0.0-dev.0'
type: app
targets:
  - llvm
variables:
  APAX_BUILD_ARGS:
    - "--debug" # Generate debug information for target "1500"
devDependencies:
  "@ix-ax/ax-sdk": '0.0.0-dev.0'
dependencies:
  "@ix-ax/axopen.components.abstractions": '0.0.0-dev.0'
scripts:
  download:
    - apax install -L
    - apax build
    - dotnet ixc
    - apax sld -i $AXTARGETPLATFORMINPUT -t $AXTARGET --accept-security-disclaimer --default-server-interface -r
installStrategy: strict
apaxVersion: 3.3.1
