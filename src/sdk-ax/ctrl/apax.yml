name: "@inxton/ax-sdk"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": '0.0.47'
dependencies:
  '@ax/apax-build': 2.1.79
  '@ax/axunitst': 9.2.28
  '@ax/certificate-management': 2.0.0
  '@ax/diagnostic-buffer': 2.1.0
  '@ax/hw-s7-1500': 4.3.0
  '@ax/hwc': 4.3.0
  '@ax/hwld': 3.3.2
  '@ax/mod': 1.12.3
  '@ax/mon': 1.12.3
  '@ax/plc-info': 4.1.0
  '@ax/sdb': 1.12.3
  '@ax/simatic-package-tool': 2.0.17
  '@ax/sld': 3.5.9
  '@ax/st-ls': 11.3.55
  '@ax/st-resources.stc-plugin': 4.0.3
  '@ax/stc': 11.3.55
  '@ax/target-llvm': 11.3.55
  '@ax/target-mc7plus': 11.3.55
  '@ax/trace': 3.3.0
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  ib: |
    START=$(date +%s)
    apax install
    apax build
    dotnet ixc
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax ib' Finished in :" $(expr $(date +%s) - $START) "s"
  icb: |
    START=$(date +%s)
    apax install --catalog --strict
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax icb' Finished in :" $(expr $(date +%s) - $START) "s"
  cib: |
    START=$(date +%s)
    apax clean
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cib' Finished in :" $(expr $(date +%s) - $START) "s"
  cicb: |
    START=$(date +%s)
    apax clean
    apax icb
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cicb' Finished in :" $(expr $(date +%s) - $START) "s"
  ibt: |
    START=$(date +%s)
    apax install
    apax build
    dotnet ixc    
    apax test    
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax ibt' Finished in :" $(expr $(date +%s) - $START) "s"
publicKeys:
