name: "@inxton/ax-sdk"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": 0.0.32
dependencies:
  '@ax/apax-build': 2.0.20
  '@ax/axunitst': 8.3.9
  '@ax/axunitst-ls-contrib': 8.3.9
  '@ax/certificate-management': 1.2.0
  '@ax/diagnostic-buffer': 1.3.2
  '@ax/hw-s7-1500': 3.1.0
  '@ax/hwc': 3.1.0
  '@ax/hwld': 3.1.0
  '@ax/mod': 1.8.8
  '@ax/mon': 1.8.8
  '@ax/performance-info': 1.1.2
  '@ax/plc-info': 3.1.0
  '@ax/sdb': 1.8.8
  '@ax/simatic-package-tool': 2.0.15
  '@ax/sld': 3.3.3
  '@ax/st-ls': 10.2.95
  '@ax/st-resources.stc-plugin': 3.0.23
  '@ax/stc': 11.0.125
  '@ax/target-llvm': 10.2.95
  '@ax/target-mc7plus': 10.2.95
  '@ax/trace': 2.9.1
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  postbuild:
    - dotnet ixc
  ib: |
    START=$(date +%s)
    apax install
    apax build
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax ib' Finished in :" $(expr $(date +%s) - $START) "s"
  icb: |
    START=$(date +%s)
    apax install --catalog
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax icb' Finished in :" $(expr $(date +%s) - $START) "s"
  cib: |
    START=$(date +%s)
    apax clean
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cib' Finished in :" $(expr $(date +%s) - $START) "s"
  cicb: |
    START=$(date +%s)
    apax clean
    apax icb
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cicb' Finished in :" $(expr $(date +%s) - $START) "s"
  ibt: |
    START=$(date +%s)
    apax install
    apax build    
    apax test    
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax ibt' Finished in :" $(expr $(date +%s) - $START) "s"
publicKeys:
  "@inxton": 30c06ef7830b4dfd8f16e003508da1ac2d187714d0e1f38279a9332cbe4e4e17
...
