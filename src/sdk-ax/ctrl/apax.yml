name: "@inxton/ax-sdk"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": 0.0.10
dependencies:
  '@ax/apax-build': 2.0.20
  '@ax/axunitst': 7.1.6
  '@ax/axunitst-ls-contrib': 7.1.6
  '@ax/certificate-management': 1.1.3
  '@ax/diagnostic-buffer': 1.3.2
  '@ax/hw-s7-1500': 2.1.0
  '@ax/hwc': 2.1.0
  '@ax/hwld': 2.1.0
  '@ax/mod': 1.6.5
  '@ax/mon': 1.6.5
  '@ax/performance-info': 1.1.2
  '@ax/plc-info': 3.0.0
  '@ax/sdb': 1.6.5
  '@ax/simatic-package-tool': 2.0.11
  '@ax/simatic-pragma-stc-plugin': 5.0.8
  '@ax/sld': 3.1.3
  '@ax/st-ls': 9.1.36
  '@ax/st-resources.stc-plugin': 2.0.10
  '@ax/stc': 9.1.36
  '@ax/target-llvm': 9.1.36
  '@ax/target-mc7plus': 9.1.36
  '@ax/trace': 2.9.0
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  ib: |
    apax install
    apax build
  icb: |
    apax install --catalog
    apax ib
  cib: |
    apax clean
    apax ib
  cicb: |
    apax clean
    apax icb
