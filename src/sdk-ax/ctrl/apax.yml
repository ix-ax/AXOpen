name: "@inxton/ax-sdk"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": 0.0.20
dependencies:
  '@ax/apax-build': 2.0.20
  '@ax/axunitst': 8.0.33
  '@ax/axunitst-ls-contrib': 8.0.33
  '@ax/certificate-management': 1.2.0
  '@ax/diagnostic-buffer': 1.3.2
  '@ax/hw-s7-1500': 3.0.0
  '@ax/hwc': 3.0.0
  '@ax/hwld': 3.0.0
  '@ax/mod': 1.7.6
  '@ax/mon': 1.7.6
  '@ax/performance-info': 1.1.2
  '@ax/plc-info': 3.1.0
  '@ax/sdb': 1.7.6
  '@ax/simatic-package-tool': 2.0.15
  '@ax/sld': 3.2.4
  '@ax/st-ls': 10.0.85
  '@ax/st-resources.stc-plugin': 3.0.23
  '@ax/stc': 10.0.85
  '@ax/target-llvm': 10.0.85
  '@ax/target-mc7plus': 10.0.85
  '@ax/trace': 2.9.0
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  ib: |
    apax install
    apax build
  icb: |
    apax install --catalog
    apax ib
  cib: |
    apax clean
    apax ib
  cicb: |
    apax clean
    apax icb

