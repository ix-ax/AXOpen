name: "elementscomponents"
version : '0.4.4-updates-axunit.847'
type: app
targets:
  - "1500"
  - plcsim
  - llvm
variables:
  APAX_BUILD_ARGS:
    - "--debug" # Generate debug information for target "1500"
devDependencies:
  "@ix-ax/ax-sdk" : '0.4.4-updates-axunit.847'
dependencies:
  "@ix-ax/axopen.components.elements" : '0.4.4-updates-axunit.847'
scripts:
  download:
    - apax install -L
    - apax build
    - dotnet ixc
    - apax sld load --accept-security-disclaimer -t $AXTARGET -i
      $AXTARGETPLATFORMINPUT -r
installStrategy: strict
apaxVersion: 3.1.1
