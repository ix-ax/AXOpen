          - NoSecurity
          - Basic256Sha256Sign
          - Basic256Sha256SignEncrypt
      - Type: WebServer
        Enabled: true
        Parameters:
          HttpsOnly: true
      Interfaces:
      - Name: PROFINET_interface_X1
        Label: X1
        Addresses:
          Configured:
          - IPv4: "${IpAddress_X1}"
          - ProfinetDeviceName: "${PLCName}"
        Parameters:
          UseWebServerForInterface: true
          IsIoDevice: false
          TimeSynchronizationNtp: false
          IECV22LLDPMode: false
          OverwriteDeviceNames: false
          PnSendClock: 1000000
      - Name: PROFINET_interface_X2
        Label: X2
        Addresses:
          Configured:
          - IPv4: "${IpAddress_X2}"
          - ProfinetDeviceName: "${PLCName}"
        Parameters:
          UseWebServerForInterface: false
          IsIoDevice: false
          IECV22LLDPMode: false
          OverwriteDeviceNames: false
          PnSendClock: 1000000
      - Name: Virtual_communication_interface
        Label: W1
        Addresses:
          Configured:
          - IPv4: 0.0.0.0/0
          - ProfinetDeviceName: "${PLCName}"
      Ports:
      - Name: Port_1
        Label: X1 P1
      - Name: Port_2
        Label: X1 P2
