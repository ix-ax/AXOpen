      Value: plc_line
    - Name: IpAddress_X1
      Value: 10.10.10.120/24
    - Name: IpAddress_X2
      Value: 10.10.11.120/24
    Content:
      Name: "${PLCName}"
      TypeIdentifier:
        OrderNumber: 6ES7 516-3AP03-0AB0
        Version: V3.0
      AccessProtection:
        AccessLevel: FullAccess
      Services:
      - Type: OpcUaServer
        Enabled: false
