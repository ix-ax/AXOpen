Devices:
  - Name: plc_line
    Modules:
    - Apply: 6ES7516-3AP03-0AB0_v4_0
      Arguments:
        NAME: plc_line
        IP_ADDRESS_X1: '192.168.100.120/24'
        PROFINET_DEVICE_NAME_X1: 'plc_line_x1'
        ADMIN_NAME: 'admin'
        CYCLE_COMMUNICATION_LOAD: 50
  - Apply: abb_irc5_robot_in64b_out64b
    Arguments:
      NAME: abb_irc5_robot
      IP_ADDRESS_X1: 192.168.100.121/24
      PROFINET_DEVICE_NAME_X1: abb_irc5_robot
  - Apply: abb_omnicore_robot_in64b_out64b
    Arguments:
      NAME: abb_omnicore_robot
      IP_ADDRESS_X1: 192.168.100.122/24
      PROFINET_DEVICE_NAME_X1: abb_omnicore_robot
IoSystems:
- Name: profinet_plc_line
  ControllerInterfaces:
  - Ref: plc_line/plc_line/PROFINET_interface_1
  DeviceInterfaces:
  - Ref: abb_irc5_robot/abb_irc5_robot/PROFINET_Interface
  - Ref: abb_omnicore_robot/abb_omnicore_robot/PROFINET_Interface
