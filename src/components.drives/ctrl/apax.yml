name: "@inxton/axopen.components.drives"
version: '0.0.0-dev.0'
type: lib
targets:
  - llvm
files:
  - src
  - axsharp.companion.json
registries:
  "@inxton": "https://npm.pkg.github.com/"
devDependencies:
  "@inxton/ax-sdk": '0.0.0-dev.0'
dependencies:
  "@inxton/axopen.io": '0.0.0-dev.0'
installStrategy: strict
apaxVersion: 3.4.2
scripts:
  postbuild:
    - dotnet ixc
  ib: |
    apax install
    apax build
  icb: |
    apax install --catalog
    apax ib
  cib: |
    apax clean
    apax ib
  cicb: |
    apax clean
    apax icb
  ibt: |
    apax install
    apax build
    apax test
...
