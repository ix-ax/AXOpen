Templates:
  Modules:
  - Name: 6ES7518-4AP00-0AB0_v3_1
    Placeholders:
    - Name: PLCName
      Value: PLCName
    - Name: IpAddress_X1
      Value: 10.222.6.1/24
    - Name: ProfinetDeviceName_X1
      Value: plcname_profinet_interface_x1
    - Name: IpAddress_X2
      Value: 10.222.7.1/24
    - Name: ProfinetDeviceName_X2
      Value: plcname_profinet_interface_x2
    - Name: IpAddress_X3
      Value: 10.222.8.1/24
    - Name: ProfinetDeviceName_X3
      Value: plcname_profinet_interface_x3
    Content:
      Name: "${PLCName}"
      TypeIdentifier:
        OrderNumber: 6ES7 518-4AP00-0AB0
        Version: V3.1
      AccessProtection:
        AccessLevel: FullAccess
      Services:
      - Type: Syslog
        Enabled: False
        Parameters:
          Address: 0.0.0.0
          Port: 65535
          TransportProtocolType: TLSServerAndClientAuthentication
          AutoAcceptServer: False
          # TrustedServerCertificates:
          # - TrustedSyslogServer.cer
      - Type: OpcUaServer
        Enabled: False
        Parameters:
          SecurityPolicies:
          - NoSecurity
          - Basic256Sha256Sign
          - Basic256Sha256SignEncrypt
      - Type: WebServer
        Enabled: True
        Parameters:
          HttpsOnly: True
      Interfaces:
      - Name: profinet_x1
        Label: X1
        Addresses:
          Configured:
          - IPv4: "${IpAddress_X1}"
          - ProfinetDeviceName:  "${ProfinetDeviceName_X1}"
        Parameters:
          OverwriteDeviceNames: False
          PnSendClock: 1000000
          UseWebServerForInterface: True
          IECV22LLDPMode: False
      - Name: profinet_x2
        Label: X2
        Addresses:
          Configured:
          - IPv4: "${IpAddress_X2}"
          - ProfinetDeviceName:  "${ProfinetDeviceName_X2}"
        Parameters:
          OverwriteDeviceNames: False
          PnSendClock: 1000000
          UseWebServerForInterface: False
          IECV22LLDPMode: False
      - Name: profinet_x3
        Label: X3
        Addresses:
          Configured:
          - IPv4: "${IpAddress_X3}"
          - ProfinetDeviceName:  "${ProfinetDeviceName_X3}"
      - Name: virtual_communication_interface
        Label: W1
        Addresses:
          Configured:
          - IPv4: 0.0.0.0/0
          - ProfinetDeviceName: "${PLCName}"
      Ports:
      - Name: Port_1
        Label: X1 P1
      - Name: Port_2
        Label: X1 P2
      - Name: Port_3
        Label: X2 P1
      - Name: Port_4
        Label: X3 P1
      Parameters:
        PnDnsConfigNameResolve: 0
        AdditionalInformation: ''
        # ClockMemoryByteAddress: 0   # Read Only
        ClockMemoryByte: False
        CycleCommunicationLoad: 50
        CycleEnableMinimumCycleTime: True
        CycleMaximumCycleTime: 150
        CycleMinimumCycleTime: 1
        ConfigurationControl: False
        LocationIdentifier: ''
        PlantDesignation: ''
        # ProtectionEnablePutGetCommunication: False    # Read Only
        ProtectionIntervalForSummarizeOfSecurityEvents: 20
        ProtectionSummarizeSecurityEventsOnHighLoad: True
        ProtectionUnitForSummarizeOfSecurityEvents: 2
        StartupActionAfterPowerOn: 3
        StartupComparisonPresetToActualModule: 2
        StartupConfigurationTimeout: 60000
        # SystemMemoryByteAddress: 1    # Read Only
        SystemMemoryByte: False
        SystemPowerSupplyExternal: 1
        TimeOfDayActivateDaylightSavingTime: True
        TimeOfDayDaylightSavingTimeOffset: 60
        TimeOfDayDaylightSavingTimeStartHour: 1
        TimeOfDayDaylightSavingTimeStartMonth: 3
        TimeOfDayDaylightSavingTimeStartWeek: 5
        TimeOfDayDaylightSavingTimeStartWeekday: 1
        TimeOfDayLocalTimeZone: 22
        TimeOfDayStandardTimeStartHour: 2
        TimeOfDayStandardTimeStartMonth: 10
        TimeOfDayStandardTimeStartWeek: 5
        TimeOfDayStandardTimeStartWeekday: 1
        # TimeSynchronizationServer1: ''    # Read Only
        # TimeSynchronizationServer2: ''    # Read Only
        # TimeSynchronizationServer3: ''    # Read Only
        # TimeSynchronizationServer4: ''    # Read Only
        # TimeSynchronizationUpdateInterval: 10   # Read Only
        CentralAlarmManagement: True
        ProDiagUsedLicenses: 0
        EnergySuitePurchasedLicense10: 0
        EnergySuitePurchasedLicense5: 0
        IPv4ForwardingActive: False
        # MacRtLicensePurchased: 0    # Read Only
        TimeSynchronizationNtpV2: 0
        # DomainConfiguration: 3    # Read Only
        HostAndDomainnameActive: False
        # Hostname: ''    # Read Only
        # HostnameConfiguration: 3    # Read Only
        # HostnameIdenticalToDeviceNameActive: False    # Read Only
        # Domain: ''    # Read Only
      UserManagement:
        Users:
        - Name: adm
          AssignedRoles:
          - AdminRole
        Roles:
        - Name: AdminRole
          FunctionRights:
          - ReadPlcVariables
          - WritePlcVariables
          - ReadFiles
          - QueryDiagnostics
          - FlashLed
          # - AccessProtectionFailsafeAccess
          # - AccessProtectionFullAccess
          # - AccessProtectionHMIAccess
          # - AccessProtectionReadAccess
          - OpcUAServerAccess
          - OpcUAManageCertificates
        - Name: WebServerAccessRole
          FunctionRights:
          - ReadPlcVariables
          - WritePlcVariables
          - ReadFiles
          - QueryDiagnostics
          - FlashLed
