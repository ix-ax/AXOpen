              FileName: 'gsdml-v2.42-cognex-datamanclassb-20220124.xml'
            Slot: 2
          - Name: Results_Control
            TypeIdentifier:
              GsdId: '102'
              FileName: 'gsdml-v2.42-cognex-datamanclassb-20220124.xml'
            Slot: 3
          - Name: Results_Status
            TypeIdentifier:
              GsdId: '202'
              FileName: 'gsdml-v2.42-cognex-datamanclassb-20220124.xml'
            Slot: 4
          - Name: Soft_Event_Control
            TypeIdentifier:
              GsdId: '105'
              FileName: 'gsdml-v2.42-cognex-datamanclassb-20220124.xml'
            Slot: 5
          - Apply: ${USER_DATA}
          - Apply: ${RESULT_DATA}
