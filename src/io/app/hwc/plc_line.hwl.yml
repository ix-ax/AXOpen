Devices:
  - Name: plc_line
    Modules:
    - Apply: 6ES7516-3AP03-0AB0_v4_0
      Arguments:
        NAME: plc_line
        IP_ADDRESS_X1: '192.168.100.120/24'
        PROFINET_DEVICE_NAME_X1: 'plc_line_x1'
        IP_ADDRESS_X2: '192.168.101.120/24'
        PROFINET_DEVICE_NAME_X2: 'plc_line_x2'
        ADMIN_NAME: 'admin'
        CYCLE_COMMUNICATION_LOAD: 50
  # HIGHLY IMPORTANT NOTE:
  # Due to the missing built-in configuration tool for IO-Link on the AX side (something like S7-PCT in TIA Portal),
  # it is not recommended to use any IO-Link devices that need to be configured.
  # If such devices are used, they must be configured using the vendor tools, matching the EXACT configuration in HWC.
  # Currently supported combinations are:
  #   -------------------------------------------------------------------------
  #   BNI0099 connected to ports X01–X08 of the BNI00L3
  #   The BNI0099 itself must be configured using the Balluff configuration tool.
  #   Example of BNI0099 connected to port X04:
  #     X04: balluff_bni00l3_bni0099
  #   -------------------------------------------------------------------------
  #   -------------------------------------------------------------------------
  #   Extended configuration: BNI0099 connected to ports X01–X08 of the BNI00L3,
  #   with an additional BNI0099 connected to port 7 of the first BNI0099.
  #   Both BNI0099 devices (the primary and the additional one) must be configured
  #   using the Balluff configuration tool.
  #   Example of an extended BNI0099 with an additional one connected to port X02:
  #     X02: balluff_bni00l3_bni0099_bni0099
  #   -------------------------------------------------------------------------
  #   -------------------------------------------------------------------------
  #   BNI00AY connected to ports X01–X08 of the BNI00L3
  #   The BNI00AY itself must be configured using the Balluff configuration tool.
  #   Example of BNI00AY connected to port X03:
  #     X03: balluff_bni00l3_bni00ay
  #   -------------------------------------------------------------------------
  #   -------------------------------------------------------------------------
  #   Extended configuration: BNI00AY connected to ports X01–X08 of the BNI00L3,
  #   with an additional BNI00AY connected to port 15 of the first BNI00AY.
  #   Both BNI00AY devices (the primary and the additional one) must be configured
  #   using the Balluff configuration tool.
  #   Example of an extended BNI00AY with an additional one connected to port X01:
  #     X01: balluff_bni00l3_bni00ay_bni00ay
  #   -------------------------------------------------------------------------
  - Apply: balluff_bni00l3  
    Arguments:
      NAME: bni00l3
      IP_ADDRESS_X1: 192.168.100.122/24
      PROFINET_DEVICE_NAME_X1: bni00l3
      X01: balluff_bni00l3_bni00ay_bni00ay 
      X02: balluff_bni00l3_bni0099_bni0099
      X03: balluff_bni00l3_bni00ay
      X04: balluff_bni00l3_bni0099
IoSystems:
- Name: profinet_plc_line
  ControllerInterfaces:
  - Ref: plc_line/plc_line/PROFINET_interface_1
  DeviceInterfaces:
  - Ref: et200sp/et200sp/PN-IO
  - Ref: bni00l3/bni00l3/PN-IO
