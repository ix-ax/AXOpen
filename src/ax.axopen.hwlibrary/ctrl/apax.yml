name: "@inxton/ax.axopen.hwlibrary"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": '0.0.52'
devDependencies:
  "@inxton/ax-sdk": '0.0.0-dev.0'
dependencies:
  "@inxton/ax.axopen.min": '0.0.0-dev.0'
  "@ax/simatic-distributedio": 11.0.44
  "@ax/simatic-diagnostics-hardware": 11.0.0
  "@ax/simatic-clocks": 11.0.116
  "@ax/system-timer": 10.4.16
  "@ax/system-serde": 10.4.16
  "@ax/system-bitaccess": 10.4.16
  "@ax/simatic-memoryaccess": 6.0.66
  "@ax/simatic-hardware-utilities": 6.0.66
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  ib: |
    START=$(date +%s)
    apax install
    apax build
    dotnet ixc
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax ib' Finished in :" $(expr $(date +%s) - $START) "s"
  icb: |
    START=$(date +%s)
    apax install --catalog --strict
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax icb' Finished in :" $(expr $(date +%s) - $START) "s"
  cib: |
    START=$(date +%s)
    apax clean
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cib' Finished in :" $(expr $(date +%s) - $START) "s"
  cicb: |
    START=$(date +%s)
    apax clean
    apax icb
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cicb' Finished in :" $(expr $(date +%s) - $START) "s"
