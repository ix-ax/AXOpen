name: "axopen.data-app"
version : '0.4.4-updates-axunit.847'
type: app
targets:
  - plcsim
  - llvm
  - "1500"
variables:
  APAX_BUILD_ARGS: [-d]
devDependencies:
  "@ix-ax/ax-sdk" : '0.4.4-updates-axunit.847'
dependencies:
  "@ix-ax/axopen.data" : '0.4.4-updates-axunit.847'
  "@ix-ax/axopen.simatic1500" : '0.4.4-updates-axunit.847'
scripts:
  download: |
    apax install
    apax build
    dotnet ixc
    apax sld load --accept-security-disclaimer -t $AXTARGET -i $AXTARGETPLATFORMINPUT -r
installStrategy: strict
apaxVersion: 3.1.1
