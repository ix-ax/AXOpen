name: "@inxton/ax.latest.packages"
version: '0.0.0-dev.0'
type: generic
files:
  - apax.yml
devDependencies:
  "@inxton/ax-sdk": '0.0.0-dev.0'
registries:
  "@inxton": "https://npm.pkg.github.com/"
catalogs:
  "@inxton/ax.catalog": 0.0.29
dependencies:
  "@ax/simatic-1500-clocks": 10.0.6
  "@ax/system-bitaccess": 10.0.24
  "@ax/system-math": 10.0.24
  "@ax/system-serde": 10.0.24
  "@ax/hwc": 3.1.0
  "@ax/hw-s7-1500": 3.1.0
  "@ax/hwld": 3.1.0
  "@ax/stc": 10.2.82
  "@ax/sld": 3.3.3
installStrategy: strict
apaxVersion: 3.5.0
scripts:
  ib: |
    START=$(date +%s)
    apax install
    apax build
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax ib' Finished in :" $(expr $(date +%s) - $START) "s"
  icb: |
    START=$(date +%s)
    apax install --catalog
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax icb' Finished in :" $(expr $(date +%s) - $START) "s"
  cib: |
    START=$(date +%s)
    apax clean
    apax ib
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cib' Finished in :" $(expr $(date +%s) - $START) "s"
  cicb: |
    START=$(date +%s)
    apax clean
    apax icb
    echo $(date +%D)"-"$(date +%H)":"$(date +%M)":"$(date +%S) " - 'apax cicb' Finished in :" $(expr $(date +%s) - $START) "s"
